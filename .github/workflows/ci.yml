# CI Enhance (ADR-029). Aucun GPU, aucun SDK NVIDIA, aucun secret, aucune publication.
# Les tests GPU tournent en LOCAL (scripts/test-gpu.ps1).
# Les controles de securite (identite, secrets, zero reseau sources, deps, lint des workflows) sont dans
# security.yml (sans paths-ignore). TODO restant : confirmer l'image Windows avec VS 2026 (toolset v145).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: '1'

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer clang-format (version epinglee)
        run: pip install "clang-format==22.1.3"
      - name: clang-format --dry-run
        run: |
          clang-format --version
          files=$(git ls-files 'src/*.cpp' 'src/*.hpp' 'src/*.h' 'tests/*.cpp' 'tests/*.hpp')
          if [ -n "$files" ]; then echo "$files" | xargs clang-format --dry-run --Werror; fi

  core:
    runs-on: windows-2025 # TODO: image VS 2026 (toolset v145) a confirmer ; sinon v143 en CI, ecart documente
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache binaire vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
      - name: vcpkg (au commit epingle)
        shell: pwsh
        run: scripts/bootstrap.ps1 -VcpkgRoot "$env:RUNNER_TEMP\vcpkg" -BinaryCache "$HOME\vcpkg-cache" -Run
      - name: Variables vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$HOME\vcpkg-cache" >> $env:GITHUB_ENV
      - name: Configure + build (preset ci, ENH_WITH_GPU=OFF)
        shell: pwsh
        run: scripts/build.ps1 -Preset ci
      - name: Tests unitaires (label unit)
        shell: pwsh
        run: scripts/test.ps1 -Preset ci -NoBuild
      - name: Zero reseau sur les binaires du build ci (C2/C3/C4)
        shell: pwsh
        run: scripts/check-no-network.ps1 -Path build/ci -Report zero-network.md
      - name: Rapport zero reseau
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-network
          path: zero-network.md
          retention-days: 7
          if-no-files-found: ignore
      # TODO: variante ASan (/fsanitize=address, ADR-030) une fois le coeur en place.

  tidy:
    runs-on: windows-2025
    timeout-minutes: 30
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache binaire vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
      - name: vcpkg
        shell: pwsh
        run: |
          scripts/bootstrap.ps1 -VcpkgRoot "$env:RUNNER_TEMP\vcpkg" -BinaryCache "$HOME\vcpkg-cache" -Run
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
      - name: Configure (compile_commands.json)
        shell: pwsh
        run: scripts/build.ps1 -Preset ci -ConfigureOnly
      - name: clang-tidy (src/, sans .cu)
        shell: pwsh
        run: |
          . scripts/common.ps1
          $tidy = Join-Path (Get-VsInstallPath) 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
          # Seulement les fichiers reellement compiles par le preset ci (sans GPU ni UI) : les autres
          # (FFmpeg, CUDA, Qt) n'ont pas leurs en-tetes sur le runner. Ils sont analyses en local.
          $db = Get-Content build/ci/compile_commands.json -Raw | ConvertFrom-Json
          $built = $db.file | ForEach-Object { (Resolve-Path -LiteralPath $_).Path } | Sort-Object -Unique
          $files = git ls-files 'src/*.cpp' | Where-Object { (Resolve-Path -LiteralPath $_).Path -in $built }
          if ($files) { & $tidy -p build/ci --quiet --extra-arg=-Wno-unused-command-line-argument @files; if ($LASTEXITCODE -ne 0) { exit 1 } }

  ui:
    # Pull requests et lancement manuel seulement (economie de minutes, ADR-029).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 30
    needs: core
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qt officiel (tests seulement ; le Qt livre est celui de vcpkg, ADR-024)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.11.2'
          arch: win64_msvc2022_64
          modules: 'qtshadertools'
      - name: Configure + build (preset ci-ui)
        shell: pwsh
        run: scripts/build.ps1 -Preset ci-ui
      - name: Tests UI (label ui)
        shell: pwsh
        run: |
          . scripts/common.ps1
          $t = Enter-EnhVsEnv
          # Tests ui livres par ENH-004 : leur absence est une erreur.
          & $t.Ctest --test-dir build/ci-ui -L ui --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit 1 }

  sast:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cppcheck 2.22.0 (MSI epingle, SHA-256 verifiee)
        shell: pwsh
        run: |
          $url = 'https://github.com/danmar/cppcheck/releases/download/2.22.0/cppcheck-2.22.0-x64-Setup.msi'
          $sha = '3929162bab7e71d1b9b18708ec054fb0188bfc8ea1660979ed95837f5a9f547b'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\cppcheck.msi"
          if ((Get-FileHash "$env:RUNNER_TEMP\cppcheck.msi" -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw 'SHA-256 cppcheck differente.' }
          Start-Process msiexec.exe -Wait -ArgumentList '/i', "$env:RUNNER_TEMP\cppcheck.msi", '/qn', '/norestart'
      - name: cppcheck (src/)
        shell: pwsh
        run: |
          $cpp = "$env:ProgramFiles\Cppcheck\cppcheck.exe"
          & $cpp --version
          & $cpp --platform=win64 --std=c++20 --enable=warning,performance,portability --suppress=unknownMacro --inline-suppr --error-exitcode=1 -I src src
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: semgrep 1.182.0 (regles locales, sans telemetrie)
        shell: pwsh
        run: |
          if (-not (Test-Path .semgrep)) { Write-Host 'Pas de regles locales (.semgrep/) : etape ignoree (ENH-003, secdevops).'; exit 0 }
          python -m pip install "semgrep==1.182.0"
          semgrep scan --config .semgrep --metrics=off --error --quiet src
